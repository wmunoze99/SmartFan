name: Release firmware

on:
  push:
    # branches:
    #   - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        display: [ssd1306, sh1106]
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      DISPLAY_VARIANT: ${{ matrix.display }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache ESP-IDF components
        uses: actions/cache@v4
        with:
          path: |
            managed_components
            ~/.cache/Espressif/ComponentManager
          key: ${{ runner.os }}-idf-v5.5.5-esp32c6-components-${{ hashFiles('dependencies.lock', '**/idf_component.yml') }}
          restore-keys: |
            ${{ runner.os }}-idf-v5.5.5-esp32c6-components-

      - name: Cache compiler objects
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-idf-v5.5.5-esp32c6-ccache-${{ matrix.display }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-idf-v5.5.5-esp32c6-ccache-${{ matrix.display }}-

      - name: Configure build
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag must use vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            echo "FIRMWARE_VERSION=${version}" >> "$GITHUB_ENV"
          else
            echo "FIRMWARE_VERSION=0.1.0-dev" >> "$GITHUB_ENV"
          fi

          ota_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/smart_fan-{display}.bin"
          sed -i "s|^CONFIG_FAN_OTA_RELEASE_URL=.*|CONFIG_FAN_OTA_RELEASE_URL=\"${ota_url}\"|" sdkconfig.defaults

      - name: Build
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          rm -f build/sdkconfig build/sdkconfig.old
          idf.py -B build \
            -DIDF_TARGET=esp32c6 \
            -DSDKCONFIG=build/sdkconfig \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;config/sdkconfig.${DISPLAY_VARIANT}" \
            -DCCACHE_ENABLE=1 reconfigure build

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp build/smart_fan.bin "dist/smart_fan-${DISPLAY_VARIANT}.bin"
          cp build/smart_fan.elf "dist/smart_fan-${DISPLAY_VARIANT}.elf"
          (cd dist && sha256sum "smart_fan-${DISPLAY_VARIANT}.bin" > "smart_fan-${DISPLAY_VARIANT}.sha256")

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.display }}
          path: dist/smart_fan-${{ matrix.display }}.*
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist

      - name: Prepare legacy SH1106 aliases
        shell: bash
        run: |
          cp dist/smart_fan-sh1106.bin dist/smart_fan.bin
          cp dist/smart_fan-sh1106.elf dist/smart_fan.elf
          (cd dist && sha256sum smart_fan.bin > smart_fan.sha256)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/smart_fan-ssd1306.bin
            dist/smart_fan-ssd1306.elf
            dist/smart_fan-ssd1306.sha256
            dist/smart_fan-sh1106.bin
            dist/smart_fan-sh1106.elf
            dist/smart_fan-sh1106.sha256
            dist/smart_fan.bin
            dist/smart_fan.elf
            dist/smart_fan.sha256
